short_bio: >-
  <p>
    I am a Ph.D. student in the Department of Computer Science at Boston University,
    advised by <a href="https://www.bu.edu/cs/profiles/hongwei-xi/">Prof. Hongwei Xi</a>.
    My research interests lie in programming languages, type systems, and verification.
    I have successfully defended my thesis on December 5, 2025.
  </p>
  <p>
    These days research is mainly focused on the design of languages and type
    systems that tackle issues in memory safety and concurrency as well as the
    development of novel language features that aid programmer productivity and
    reasoning. A common thread between my works is that they are guided by ideas
    from substructural logics while also drawing influences from other areas
    such as dependent type theory, session types, probabilistic programming, etc.
  </p>

